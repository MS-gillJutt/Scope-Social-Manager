version: "3.8"

services:
  # ===========================================================================
  # PostgreSQL 16 — Primary Relational Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: postlane-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postlane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postlane}
      POSTGRES_DB: ${POSTGRES_DB:-postlane_dev}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postlane} -d ${POSTGRES_DB:-postlane_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - postlane-network

  # ===========================================================================
  # Redis 7 — Caching, Pub/Sub, and BullMQ Queues
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: postlane-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - postlane-network

volumes:
  postgres_data:
    name: postlane_postgres_data
  redis_data:
    name: postlane_redis_data

networks:
  postlane-network:
    name: postlane-network
    driver: bridge
